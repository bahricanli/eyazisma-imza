<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kart ve sertifikalar — e-Yazışma</title>
<style>body{font:17px system-ui;max-width:850px;margin:40px auto;padding:0 20px;line-height:1.6}button{font:inherit;padding:10px 18px;cursor:pointer}li{border:1px solid #bbb;border-radius:8px;padding:16px;margin:12px 0;overflow-wrap:anywhere}#status{white-space:pre-wrap}small{color:#555}</style>
<h1>Kart ve imza sertifikaları</h1>
<small>Sürüm {{.Version}} · Uygulama mimarisi: {{.Architecture}}</small>
<p>Belge bağlantısı gerekmez. Kartlar ve PIN kullanılmadan görünen imza sertifikaları bu bilgisayarda okunur. İmza atılmaz.</p>
<button id="refresh">Kartları yeniden listele</button><p id="status" role="status"></p><ul id="cards"></ul>
<script>
const button=document.getElementById('refresh'),status=document.getElementById('status'),cards=document.getElementById('cards');
async function refresh(){button.disabled=true;cards.replaceChildren();status.textContent='Kartlar ve sertifikalar okunuyor…';try{
const response=await fetch('/api/local-cards',{method:'POST',headers:{'X-Bridge-Token':'{{.Token}}'}});
const data=await response.json();if(!response.ok)throw new Error(data.message||'Kartlar okunamadı.');
for(const label of data.cards){const item=document.createElement('li');item.textContent=label;cards.append(item);}
status.textContent=data.cards.length?'Kart ve sertifika bilgileri aşağıda.':'Kart bulunamadı. Kartı takıp yeniden listeleyin.';
}catch(error){status.textContent=error.message;}finally{button.disabled=false;}}
button.addEventListener('click',refresh);refresh();
</script></html>
