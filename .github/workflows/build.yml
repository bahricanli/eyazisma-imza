name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Token tests against SoftHSM
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq softhsm2 opensc
          sudo usermod -a -G softhsm "$USER" || true
          ./scripts/softhsm-test.sh
      - run: go build -ldflags "-X main.version=${{ github.ref_name }}" ./cmd/eyazisma-imza
      - uses: actions/upload-artifact@v4
        with:
          name: eyazisma-imza-${{ matrix.os }}
          path: |
            eyazisma-imza
            eyazisma-imza.exe
          if-no-files-found: error
      # Card drivers on many Macs are still Intel-only; a driver can only be loaded by a build of its own kind.
      - name: Intel build for macOS
        if: runner.os == 'macOS'
        run: GOARCH=amd64 CGO_ENABLED=1 go build -ldflags "-X main.version=${{ github.ref_name }}" -o eyazisma-imza-intel ./cmd/eyazisma-imza
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: eyazisma-imza-macos-intel
          path: eyazisma-imza-intel
          if-no-files-found: error

  # A version tag publishes the builds as a pre-release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the builds
        run: |
          mkdir release
          cp artifacts/eyazisma-imza-windows-latest/eyazisma-imza.exe release/eyazisma-imza-windows-amd64.exe
          cp artifacts/eyazisma-imza-ubuntu-latest/eyazisma-imza release/eyazisma-imza-linux-amd64
          cp artifacts/eyazisma-imza-macos-latest/eyazisma-imza release/eyazisma-imza-macos-arm64
          cp artifacts/eyazisma-imza-macos-intel/eyazisma-imza-intel release/eyazisma-imza-macos-intel
          cd release && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --title "${{ github.ref_name }}" --prerelease --notes-file .github/release-notes.md
