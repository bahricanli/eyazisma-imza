name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -ldflags "-X main.version=${{ github.ref_name }}" ./cmd/eyazisma-imza
      - uses: actions/upload-artifact@v4
        with:
          name: eyazisma-imza-${{ matrix.os }}
          path: |
            eyazisma-imza
            eyazisma-imza.exe
          if-no-files-found: error
